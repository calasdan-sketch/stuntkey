<svg xmlns="http://www.w3.org/2000/svg" width="760" height="368" viewBox="0 0 760 368" role="img" aria-label="Terminal recording: stuntkey list, stuntkey selftest stopping 73 of 73 simulated attacks, stuntkey audit show">
  <title>stuntkey in a terminal: real output of three commands</title>
  <style>
    .bg { fill: #0f1720; }
    .bar { fill: #1c2733; }
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 14px; fill: #d6e2ee; white-space: pre; }
    .p { fill: #7fc4ff; }
    .ok { fill: #6fe3a1; }
    .dim { fill: #8aa0b4; }
    .l { opacity: 0; animation: show 0.01s linear forwards; }
    @keyframes show { to { opacity: 1; } }
    .cur { animation: blink 1s steps(1) infinite; fill: #d6e2ee; }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .l { opacity: 1; animation: none; } .cur { animation: none; } }
  </style>
  <rect class="bg" width="760" height="368" rx="10"/>
  <rect class="bar" width="760" height="30" rx="10"/>
  <circle cx="20" cy="15" r="6" fill="#ff6b6b"/><circle cx="40" cy="15" r="6" fill="#ffd166"/><circle cx="60" cy="15" r="6" fill="#6fe3a1"/>
  <text x="300" y="20" class="dim" style="font-size:12px">stuntkey (real output)</text>


  <text x="20" y="58" class="l" style="animation-delay:2.0s"><tspan class="p">$ </tspan>stuntkey list</text>
  <text x="20" y="80" class="l" style="animation-delay:2.7s">  airtable       Airtable                  -&gt; AIRTABLE_API_KEY</text>
  <text x="20" y="100" class="l" style="animation-delay:2.9s">  anthropic      Anthropic (Claude API)    -&gt; ANTHROPIC_API_KEY</text>
  <text x="20" y="120" class="l dim" style="animation-delay:3.1s">  ... 36 services in all</text>

  <text x="20" y="150" class="l" style="animation-delay:4.2s"><tspan class="p">$ </tspan>stuntkey selftest</text>
  <text x="20" y="172" class="l dim" style="animation-delay:5.0s">  attacking itself with a made-up key and a pretend server</text>
  <text x="20" y="192" class="l" style="animation-delay:5.8s">  Key leaks              20 of 20 stopped</text>
  <text x="20" y="210" class="l" style="animation-delay:6.2s">  Addresses and paths    24 of 24 stopped</text>
  <text x="20" y="228" class="l" style="animation-delay:6.6s">  Approval and limits    10 of 10 stopped</text>
  <text x="20" y="246" class="l" style="animation-delay:7.0s">  AWS key-minting         6 of 6 stopped</text>
  <text x="20" y="264" class="l" style="animation-delay:7.4s">  Activity log           10 of 10 stopped</text>
  <text x="20" y="282" class="l" style="animation-delay:7.8s">  Helper programs         3 of 3 stopped</text>
  <text x="20" y="306" class="l ok" style="animation-delay:8.6s">73 of 73 attacks stopped.</text>
  <text x="20" y="324" class="l dim" style="animation-delay:8.8s">Simulated attacks on stuntkey's rules. Not a security audit.</text>

  <text x="20" y="352" class="l" style="animation-delay:10.2s"><tspan class="p">$ </tspan>stuntkey audit show   <tspan class="dim"> nothing yet - no AI has used a key through stuntkey.</tspan></text>
</svg>
